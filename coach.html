<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="description" content="An AI English coach you talk to. Real voice conversations, gentle corrections afterwards, and the words you actually need." />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>coach · talk your way into English</title>

  <meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Coach" />

  <link rel="manifest" href="manifest-coach.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-coach.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-coach-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-coach-512.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/coach.css?v=1" />
</head>
<body>

  <header class="appbar">
    <span class="wordmark">coach</span>
    <span id="server-badge" class="server-badge">Built-in coach</span>
  </header>

  <main id="screen" class="screen" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Main">
    <button type="button" data-tab="home" class="is-on" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5"/><path d="M6 10v9.5h12V10"/></svg>
      <span>Home</span>
    </button>
    <button type="button" data-tab="talk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg>
      <span>Talk</span>
    </button>
    <button type="button" data-tab="learn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M8 7.5h7M8 11h5"/></svg>
      <span>Learn</span>
    </button>
    <button type="button" data-tab="progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="m7.5 15 3.5-4 3 2.5L20 7"/></svg>
      <span>Progress</span>
    </button>
    <button type="button" data-tab="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 4-5.2 7-5.2s5.8 1.6 7 5.2"/></svg>
      <span>Profile</span>
    </button>
  </nav>

  <!-- ------------------------------------------------ tela de conversa -->
  <div id="voice" class="voice" hidden data-state="idle">
    <div id="voice-shell" class="voice-shell">
      <header class="voice-head">
        <span id="voice-topic" class="voice-topic"></span>
        <span id="voice-timer" class="voice-timer">00:00</span>
      </header>

      <div class="voice-stage">
        <button id="orb" class="orb" type="button" aria-label="Tap to interrupt and speak">
          <span class="orb-ring orb-ring-1"></span>
          <span class="orb-ring orb-ring-2"></span>
          <span class="orb-core"></span>
        </button>
        <p id="voice-status" class="voice-status">Listening…</p>
        <p id="voice-partial" class="voice-partial"></p>
      </div>

      <div id="voice-live" class="voice-live">
        <div id="voice-transcript" class="transcript"></div>
      </div>

      <form id="voice-form" class="voice-keyboard">
        <div id="voice-keyboard" class="voice-keyboard-row" hidden>
          <input id="voice-input" class="field" type="text" placeholder="Type what you want to say…"
                 autocomplete="off" autocapitalize="sentences" />
          <button class="btn btn-primary" type="submit">Send</button>
        </div>
      </form>

      <footer class="voice-controls">
        <button id="btn-mute" class="ctl" type="button" aria-label="Mute microphone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg>
          <span>Mic</span>
        </button>
        <button id="btn-keyboard" class="ctl" type="button" aria-label="Type instead">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/></svg>
          <span>Type</span>
        </button>
        <button id="btn-end" class="ctl ctl-end" type="button">End</button>
        <button id="btn-transcript" class="ctl" type="button" aria-label="Show or hide the transcript">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 11h16M4 16h10"/></svg>
          <span>Text</span>
        </button>
        <button id="btn-pause" class="ctl ctl-word" type="button">Pause</button>
      </footer>
    </div>
  </div>

  <!-- ------------------------------------------------------ folha de detalhe -->
  <div id="sheet" class="sheet" hidden>
    <div id="sheet-backdrop" class="sheet-backdrop"></div>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grip"></div>
      <header class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button id="sheet-close" class="icon-round" type="button" aria-label="Close">×</button>
      </header>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <!-- ------------------------------------------------------------ onboarding -->
  <div id="onboarding" class="onboarding" hidden>
    <div id="onboarding-body" class="onboarding-body"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw-coach.js").catch(() => {});
      });
    }
  </script>
  <script type="module" src="js/coach/app.js?v=1"></script>
</body>
</html>
