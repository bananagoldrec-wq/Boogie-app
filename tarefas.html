<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Listas de tarefas simples por assunto: Casa, Banana Gold, Produção Musical e DJ." />
  <title>Tarefas</title>

  <!-- PWA / atalho na tela inicial -->
  <link rel="manifest" href="manifest-tarefas.json" />
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)" />

  <!-- iOS: roda em tela cheia -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tarefas" />

  <!-- Ícones -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-tarefas.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-tarefas-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-tarefas-512.png" />

  <link rel="stylesheet" href="css/tarefas.css?v=1" />
</head>
<body>
  <header class="top">
    <div class="title-row">
      <h1 id="list-title">Tarefas</h1>
      <span id="count" class="count"></span>
    </div>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Listas"></nav>
  </header>

  <main class="main">
    <form id="add-form" class="add" autocomplete="off">
      <span class="add-plus" aria-hidden="true">+</span>
      <input id="add-input" type="text" placeholder="Nova tarefa" enterkeyhint="done" aria-label="Nova tarefa" />
    </form>

    <ul id="todo" class="list" aria-label="A fazer"></ul>
    <p id="empty" class="empty" hidden>Nada por aqui. Escreve aí em cima ☝️</p>

    <section id="done-wrap" class="done-wrap" hidden>
      <div class="done-head">
        <button id="done-toggle" class="done-toggle" type="button" aria-expanded="true">
          <span class="chev" aria-hidden="true">▾</span> Feitas <span id="done-count"></span>
        </button>
        <button id="clear-done" class="link" type="button">Limpar</button>
      </div>
      <ul id="done" class="list done" aria-label="Feitas"></ul>
    </section>
  </main>

  <!-- Menu da aba (renomear / apagar) -->
  <dialog id="tab-dialog" class="sheet">
    <form method="dialog" id="tab-form">
      <h2 id="tab-dialog-title">Lista</h2>
      <input id="tab-name" type="text" maxlength="40" placeholder="Nome da lista" autocomplete="off" />
      <div class="sheet-actions">
        <button id="tab-delete" class="danger" type="button">Apagar lista</button>
        <span class="grow"></span>
        <button value="cancel" type="submit" class="ghost" formnovalidate>Cancelar</button>
        <button id="tab-save" value="ok" type="submit" class="primary">Salvar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-msg"></span>
    <button id="toast-undo" type="button">Desfazer</button>
  </div>

  <script src="js/tarefas.js?v=1"></script>
</body>
</html>
