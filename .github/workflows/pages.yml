name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/english-conversation-coach-88mtqo
      - claude/disco-boogie-globe-app-fp48c2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 1) empacota o site
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  # 2) publica, num job separado: o GitHub às vezes demora a "enxergar" o
  #    pacote recém-enviado e o deploy no mesmo job falhava com
  #    "No artifacts named github-pages were found"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Esperar o pacote ficar disponível
        run: sleep 20

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
